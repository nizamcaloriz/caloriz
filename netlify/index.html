<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caloriz - Smart Calorie Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #00E3CC 0%, #00A89E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #00A89E;
            font-size: 48px;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #00E3CC;
            color: black;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        a:hover {
            background: #00A89E;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 227, 204, 0.3);
        }
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Caloriz</h1>
        <p>Smart calorie tracking with AI-powered food recognition. Track your nutrition, reach your goals, and live healthier.</p>
        <div class="links">
            <a href="/privacy-policy.html">Privacy Policy</a>
            <a href="/delete-account.html">Delete Account</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 Caloriz by BhoomiTechZone. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
